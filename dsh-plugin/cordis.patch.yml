# B站分身 —— DSH bundle patch
# 两条挂载：
# 1) bili-fenshen-mcp —— DSH 原生 MCP client 挂本项目 venv 里的 bilibili-mcp（28 工具，零重写）；
#    白名单门禁由 mcp_server.py 的 BILI_MCP_TOOLS 实现（未设 = 全量，兼容既有用法）。
# 2) bili-fenshen —— Host 插件本体（值班调度/手动触发/日志）。
#
# ⚠️ 换机器部署：把下面 command / args / cwd 三处绝对路径改成你的项目实际位置
#    （index.js 侧的路径已自动从插件位置推导，无需改动）。
- insert:
    - id: bili-fenshen-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: bili-fenshen
        transport: stdio
        command: /Users/yaemiko/Projects/bilibiliplayer/.venv/bin/python
        args:
          - /Users/yaemiko/Projects/bilibiliplayer/mcp_server.py
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        cwd: /Users/yaemiko/Projects/bilibiliplayer
        failOnStartupError: true
    - id: bili-fenshen
      name: 'dsh-bili-fenshen'
      config: {}
      # 值班轮模型：留空 = 跟随当前会话的默认模型（安装后在控制台「操作台 → 配置 → 模型」里改更方便，
      # 会写入 <家目录>/config.json 覆盖层，不必改这个文件）。要直接写死就取消下面注释：
      #   modelProvider: deepseek-account
      #   modelName: deepseek-flash
      #   modelReasoningEffort: high
