<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>B站分身 · 控制台 UI v3 设计稿</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   B站分身 · 控制台 v3 设计稿
   Token 命名与 DSH 宿主一致（--dsw-alias-* / --dsw-specific-*），
   页面组件全部用 bf- 前缀 —— 设计通过后可按同名类直接搬进 client.js。
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  /* —— DSH 宿主 token（浅色） —— */
  --dsw-alias-bg-base:#ffffff;
  --dsw-alias-bg-layer-1:#ffffff;
  --dsw-alias-bg-layer-2:#f7f8fa;
  --dsw-alias-bg-layer-3:#f1f3f5;
  --dsw-alias-bg-module-platform:#f9fafb;
  --dsw-alias-border-l1:#0000000a;
  --dsw-alias-border-l2:#0000001a;
  --dsw-alias-border-l4:#00000029;
  --dsw-alias-label-primary:#0f1115;
  --dsw-alias-label-secondary:#61666b;
  --dsw-alias-label-tertiary:#5f646c;
  --dsw-alias-label-caption:#6b7078;
  --dsw-alias-brand-primary:#0f1115;
  --dsw-alias-button-primary-hover:#43454a;
  --dsw-alias-interactive-bg-hover:#2631480f;
  --dsw-alias-interactive-bg-hover-solid:#f1f3f5;
  --dsw-alias-interactive-bg-active:#2631481a;
  --dsw-alias-state-success-primary:#15803d;
  --dsw-alias-state-success-tertiary:#e8f7ef;
  --dsw-alias-state-warn-primary:#9a5b00;
  --dsw-alias-state-warn-tertiary:#fdf3e3;
  --dsw-alias-state-error-primary:#d92d20;
  --dsw-alias-state-error-tertiary:#fdecea;
  --dsw-alias-state-idle-primary:#c9ccd1;
  --dsw-alias-state-business-primary:#1d4ed8;
  --dsw-alias-state-business-tertiary:#e8f0fe;
  --dsw-specific-selector:#f5f6f7;
  --dsw-specific-sidebar-fill:#f9fafb;
  --dsw-specific-sidebar-nav-item-active:#eceef1;

  /* —— 语义层（组件只用这一层） —— */
  --bg:var(--dsw-alias-bg-base);
  --surface:var(--dsw-alias-bg-layer-1);
  --surface-2:var(--dsw-alias-bg-layer-2);
  --surface-3:var(--dsw-alias-bg-layer-3);
  --surface-module:var(--dsw-alias-bg-module-platform);
  --sidebar:var(--dsw-specific-sidebar-fill);
  --line:var(--dsw-alias-border-l1);
  --line-2:var(--dsw-alias-border-l2);
  --line-3:var(--dsw-alias-border-l4);
  --text:var(--dsw-alias-label-primary);
  --text-2:var(--dsw-alias-label-secondary);
  --text-3:var(--dsw-alias-label-tertiary);
  --text-4:var(--dsw-alias-label-caption);
  --brand:var(--dsw-alias-brand-primary);
  --brand-contrast:var(--bg);
  --brand-hover:var(--dsw-alias-button-primary-hover);
  --hover:var(--dsw-alias-interactive-bg-hover);
  --hover-solid:var(--dsw-alias-interactive-bg-hover-solid);
  --active:var(--dsw-alias-interactive-bg-active);
  --nav-active:var(--dsw-specific-sidebar-nav-item-active);
  --ok:var(--dsw-alias-state-success-primary);
  --ok-bg:var(--dsw-alias-state-success-tertiary);
  --warn:var(--dsw-alias-state-warn-primary);
  --warn-bg:var(--dsw-alias-state-warn-tertiary);
  --err:var(--dsw-alias-state-error-primary);
  --err-bg:var(--dsw-alias-state-error-tertiary);
  --info:var(--dsw-alias-state-business-primary);
  --info-bg:var(--dsw-alias-state-business-tertiary);
  --idle:var(--dsw-alias-state-idle-primary);
  --pink:#fb7299;
  --blue:#23ade5;
  --focus:var(--dsw-alias-state-business-primary);
  --shadow-1:0 1px 2px rgba(15,17,21,.06);
  --shadow-2:0 10px 30px rgba(15,17,21,.12);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --mono:"SF Mono","JetBrains Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
  --r1:4px;--r2:8px;--r3:12px;--r4:16px;
  --ease:cubic-bezier(.4,0,.2,1);--dur:.16s;
  --side-w:216px;
}
html[data-theme="dark"]{
  --dsw-alias-bg-base:#141416;
  --dsw-alias-bg-layer-1:#1c1c1f;
  --dsw-alias-bg-layer-2:#242428;
  --dsw-alias-bg-layer-3:#2c2c31;
  --dsw-alias-bg-module-platform:#202024;
  --dsw-alias-border-l1:#ffffff0d;
  --dsw-alias-border-l2:#ffffff1a;
  --dsw-alias-border-l4:#ffffff33;
  --dsw-alias-label-primary:#f4f4f6;
  --dsw-alias-label-secondary:#c2c6cc;
  --dsw-alias-label-tertiary:#9297a0;
  --dsw-alias-label-caption:#8b9099;
  --dsw-alias-brand-primary:#f4f4f6;
  --dsw-alias-button-primary-hover:#d9dbe0;
  --dsw-alias-interactive-bg-hover:#ffffff10;
  --dsw-alias-interactive-bg-hover-solid:#2c2c31;
  --dsw-alias-interactive-bg-active:#ffffff1c;
  --dsw-alias-state-success-primary:#4ad07f;
  --dsw-alias-state-success-tertiary:#16271e;
  --dsw-alias-state-warn-primary:#e2a33a;
  --dsw-alias-state-warn-tertiary:#2a2317;
  --dsw-alias-state-error-primary:#f0655c;
  --dsw-alias-state-error-tertiary:#2c1a19;
  --dsw-alias-state-idle-primary:#4c5159;
  --dsw-alias-state-business-primary:#74a0ff;
  --dsw-alias-state-business-tertiary:#1a2333;
  --dsw-specific-selector:#2c2c31;
  --dsw-specific-sidebar-fill:#171719;
  --dsw-specific-sidebar-nav-item-active:#292a2f;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 12px 34px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:400 13px/21px var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
code,kbd{font-family:var(--mono);font-size:.92em}
svg{width:16px;height:16px;flex:0 0 auto;display:inline-block;vertical-align:middle}
::selection{background:color-mix(in srgb,var(--info) 24%,transparent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───────── 布局骨架 ───────── */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);height:100vh;overflow:hidden}
.app[data-collapsed="1"]{--side-w:64px}
.side{
  display:flex;flex-direction:column;min-height:0;background:var(--sidebar);
  border-right:.5px solid var(--line-2);overflow:hidden;
}
.brand{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;flex:0 0 auto}
.brand-mark{width:28px;height:28px;flex:0 0 28px;display:grid;place-items:center;border-radius:9px;
  background:linear-gradient(140deg,color-mix(in srgb,var(--pink) 88%,#fff 12%),color-mix(in srgb,var(--blue) 82%,#fff 18%));
  color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.brand-mark svg{width:18px;height:18px}
.brand-text{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.brand-text b{font-size:13.5px;font-weight:600;letter-spacing:.01em}
.brand-text i{font-style:normal;font-size:10.5px;color:var(--text-4);margin-top:2px;letter-spacing:.02em}
.app[data-collapsed="1"] .brand{padding:0;justify-content:center}
.app[data-collapsed="1"] .brand-text{display:none}
.nav{flex:1;min-height:0;overflow-y:auto;padding:6px 10px 10px;scrollbar-width:thin}
.nav-group{padding:10px 0 2px}
.nav-label{display:block;padding:0 8px 6px;font-size:10.5px;line-height:16px;color:var(--text-4);letter-spacing:.06em}
.app[data-collapsed="1"] .nav-label{display:none}
.nav-item{
  position:relative;display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;margin:1px 0;
  border-radius:var(--r2);color:var(--text-2);font-size:13px;white-space:nowrap;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}
.nav-item svg{width:16px;height:16px;flex:0 0 16px;opacity:.82}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item[aria-current="page"]{background:var(--nav-active);color:var(--text);font-weight:500}
.nav-item[aria-current="page"] svg{opacity:1}
.nav-item[aria-current="page"]::before{
  content:"";position:absolute;left:0;top:9px;bottom:9px;width:2.5px;border-radius:2px;background:var(--text);
}
.nav-item .nav-count{margin-left:auto;font-size:10.5px;color:var(--text-4);font-variant-numeric:tabular-nums}
.nav-item[aria-current="page"] .nav-count{color:var(--text-3)}
.app[data-collapsed="1"] .nav{padding:6px 8px 10px}
.app[data-collapsed="1"] .nav-item{justify-content:center;padding:0}
.app[data-collapsed="1"] .nav-item .nav-text,.app[data-collapsed="1"] .nav-count{display:none}
.side-foot{flex:0 0 auto;border-top:.5px solid var(--line-2);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.side-btn{
  display:flex;align-items:center;gap:9px;height:30px;padding:0 9px;border:0;border-radius:var(--r2);
  background:transparent;color:var(--text-3);font-size:12px;white-space:nowrap;
}
.side-btn:hover{background:var(--hover);color:var(--text)}
.side-btn svg{width:15px;height:15px;flex:0 0 15px}
.app[data-collapsed="1"] .side-btn{justify-content:center;padding:0}
.app[data-collapsed="1"] .side-btn .btn-text{display:none}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.topbar{
  height:52px;flex:0 0 52px;display:flex;align-items:center;gap:14px;padding:0 22px;
  border-bottom:.5px solid var(--line-2);background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(1.2) blur(6px);
}
.crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);min-width:0}
.crumb b{color:var(--text);font-weight:500}
.crumb .sep{color:var(--text-4)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.top-meta{font-size:11px;color:var(--text-4);white-space:nowrap;font-variant-numeric:tabular-nums}
.top-tag{font-size:10.5px;line-height:18px;padding:0 7px;border-radius:var(--r1);border:.5px solid var(--line-3);color:var(--text-3)}
.avatar{
  width:28px;height:28px;border-radius:50%;border:.5px solid var(--line-3);background:var(--surface-2);
  display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--text-2);
}
.avatar:hover{background:var(--hover-solid)}
.content{flex:1;min-height:0;overflow-y:auto;padding:24px 28px 48px}
.page{max-width:1320px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-title{font-size:20px;line-height:28px;font-weight:600;letter-spacing:.01em}
.page-sub{font-size:12.5px;line-height:19px;color:var(--text-3);margin-top:3px}
.page-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.page-foot{margin-top:26px;padding-top:14px;border-top:.5px solid var(--line-2);font-size:11px;line-height:17px;color:var(--text-4);display:flex;gap:12px;flex-wrap:wrap}

/* ───────── 卡片 / 网格 ───────── */
.card{border:.5px solid var(--line-2);border-radius:var(--r3);background:var(--surface);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:.5px solid var(--line);min-height:46px}
.card-h.bare{border-bottom:0;padding-bottom:2px}
.card-t{font-size:13px;line-height:20px;font-weight:600;white-space:nowrap}
.card-m{font-size:11.5px;line-height:18px;color:var(--text-4);font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;text-overflow:ellipsis}
.card-a{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.card-b{padding:16px}
.card-b.flush{padding:0}
.card-b.flush > .note, .card-b.flush > .card-m{padding:0 16px}
.card-b.flush .tbl th:first-child, .card-b.flush .tbl td:first-child{padding-left:16px}
.card-b.flush .tbl th:last-child, .card-b.flush .tbl td:last-child{padding-right:16px}
.card-b.tight{padding:12px 16px}
.card + .card{margin-top:14px}
.grid{display:grid;gap:14px;align-items:start}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;align-items:start}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mb-12{margin-bottom:12px}
.note{font-size:11.5px;line-height:18px;color:var(--text-4)}
.note-2{font-size:12px;line-height:19px;color:var(--text-3)}
.hint{font-size:11px;line-height:17px;color:var(--text-4);margin-top:5px}
.link{color:var(--info);cursor:pointer}
.link:hover{text-decoration:underline;text-underline-offset:2px}

/* ───────── 指标 ───────── */
.metric{border:.5px solid var(--line-2);border-radius:var(--r3);background:var(--surface);padding:13px 14px 12px;min-width:0}
.metric-l{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);white-space:nowrap}
.metric-l svg{width:13px;height:13px;opacity:.9}
.metric-v{display:flex;align-items:baseline;gap:4px;margin-top:5px;font-size:21px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.metric-v small{font-size:11.5px;font-weight:400;color:var(--text-4)}
.metric-f{font-size:11px;line-height:16px;color:var(--text-4);margin-top:3px;font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--info);border-radius:3px;transition:width .45s var(--ease)}
.bar>i.ok{background:var(--ok)}.bar>i.warn{background:var(--warn)}.bar>i.err{background:var(--err)}.bar>i.neutral{background:var(--text-4)}

/* ───────── pill / chip / tag ───────── */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;line-height:18px;padding:1px 8px;border-radius:999px;border:.5px solid var(--line-2);color:var(--text-2);background:var(--surface-2);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--idle);flex:0 0 6px}
.pill.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}.pill.ok i{background:var(--ok)}
.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}.pill.warn i{background:var(--warn)}
.pill.err{color:var(--err);background:var(--err-bg);border-color:transparent}.pill.err i{background:var(--err)}
.pill.info{color:var(--info);background:var(--info-bg);border-color:transparent}.pill.info i{background:var(--info)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:17px;padding:0 6px;border-radius:var(--r1);background:var(--surface-2);border:.5px solid var(--line);color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.chip.err{color:var(--err);background:var(--err-bg);border-color:transparent}
.chip.info{color:var(--info);background:var(--info-bg);border-color:transparent}
.chip.pink{color:color-mix(in srgb,var(--pink) 60%,var(--text));background:color-mix(in srgb,var(--pink) 12%,transparent);border-color:transparent}
.chip.mono{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;background:var(--surface-2);border:.5px solid var(--line-2);font-size:11.5px;color:var(--text-2);white-space:nowrap}
.tag button{border:0;background:none;color:var(--text-3);font-size:13px;line-height:1;padding:0}
.tag button:hover{color:var(--text)}
.tag-add{height:24px;padding:0 8px;border:.5px dashed var(--line-3);border-radius:6px;background:none;color:var(--text-4);font-size:11.5px}
.tag-add:hover{color:var(--text-2);border-color:var(--text-4)}

/* ───────── 按钮 ───────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r2);
  border:.5px solid var(--line-3);background:transparent;color:var(--text);font-size:12.5px;white-space:nowrap;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.btn svg{width:15px;height:15px}
.btn:hover{background:var(--hover-solid)}
.btn:active{background:var(--active)}
.btn.primary{background:var(--brand);color:var(--brand-contrast);border-color:transparent;font-weight:500}
.btn.primary:hover{background:var(--brand-hover)}
.btn.ghost{border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{color:var(--text);background:var(--hover)}
.btn.danger{color:var(--err);border-color:var(--line-2)}
.btn.danger:hover{background:var(--err-bg)}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px;border-radius:7px}
.btn.icon{width:28px;height:28px;padding:0}
.btn.icon.sm{width:24px;height:24px}
.btn:disabled{opacity:.4;cursor:not-allowed;background:transparent}
.btn.primary:disabled{background:var(--brand)}
.btn.wide{width:100%}

/* ───────── tabs / segmented ───────── */
.tabs{display:flex;gap:18px;border-bottom:.5px solid var(--line-2);margin:2px 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;border:0;background:none;padding:6px 0 10px;font-size:13px;color:var(--text-3);white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--text);font-weight:500}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-.5px;height:2px;border-radius:2px;background:var(--text)}
.tabs .n{display:inline-flex;align-items:center;margin-left:6px;font-size:10.5px;line-height:16px;padding:0 5px;border-radius:999px;background:var(--surface-2);color:var(--text-4);border:.5px solid var(--line);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;align-items:center;background:var(--surface-2);border:.5px solid var(--line-2);border-radius:var(--r2);padding:2px;gap:2px}
.seg button{border:0;background:none;height:24px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--text-3)}
.seg button:hover{color:var(--text)}
.seg button[aria-selected="true"]{background:var(--bg);color:var(--text);box-shadow:var(--shadow-1)}

/* ───────── 表格 ───────── */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;line-height:19px}
.tbl th{position:sticky;top:0;z-index:1;background:var(--surface);text-align:left;font-weight:500;font-size:11px;color:var(--text-4);padding:8px 10px;border-bottom:.5px solid var(--line-2);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:.5px solid var(--line);color:var(--text-2);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl .bv{font-family:var(--mono);font-size:10.5px;color:var(--text-3);white-space:nowrap}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{max-height:560px;overflow:auto;border-radius:0 0 var(--r3) var(--r3)}

/* ───────── 表单 ───────── */
.field{display:grid;grid-template-columns:136px minmax(0,1fr);gap:14px;padding:11px 0;border-bottom:.5px solid var(--line);align-items:start}
.field:last-child{border-bottom:0}
.field-l{font-size:12.5px;line-height:20px;color:var(--text-2);padding-top:3px}
.field-l small{display:block;font-weight:400;font-size:11px;line-height:16px;color:var(--text-4);margin-top:1px}

details.act{border:.5px solid var(--line-2);border-radius:var(--r3);background:var(--surface)}

    return '<div class="metric"><div class="metric-l">' + (ic ? icon(ic) : '') + esc(label) + '</div>'
      + '<div class="metric-v">' + esc(value) + (unit ? '<small>' + esc(unit) + '</small>' : '') + '</div>'
      + (foot ? '<div class="metric-f">' + esc(foot) + '</div>' : '')
      + (bar === false ? '' : '<div class="bar"><i class="' + tone + '" style="width:' + Math.max(0, Math.min(100, Number(bar) || 0)) + '%"></i></div>')
      + '</div>'
  },
  card({ title = '', meta = '', actions = '', body = '', cls = '', bodyCls = '' } = {}) {
    return '<section class="card ' + cls + '">'
      + (title ? '<header class="card-h"><span class="card-t">' + esc(title) + '</span>'
        + (meta ? '<span class="card-m">' + esc(meta) + '</span>' : '')
        + (actions ? '<span class="card-a">' + actions + '</span>' : '') + '</header>' : '')
      + '<div class="card-b ' + bodyCls + '">' + body + '</div></section>'
  },
  banner(tone, text, action = '') {
    const ic = tone === 'err' ? 'alert' : tone === 'warn' ? 'alert' : 'info'
    return '<div class="banner ' + tone + '">' + icon(ic) + '<span>' + text + '</span>' + (action ? '<span class="b-a">' + action + '</span>' : '') + '</div>'
  },
  empty({ icon: ic = 'info', title = '', text = '', action = '' } = {}) {
    return '<div class="empty">' + icon(ic) + '<b>' + esc(title) + '</b><p>' + esc(text) + '</p>' + action + '</div>'
  },
  tabs(items, active, act, prefix = 'pf') {
    return '<div class="tabs" role="tablist">' + items.map(([k, label, n]) =>
      '<button role="tab" id="' + prefix + '-tab-' + k + '" aria-controls="' + prefix + '-panel-' + k + '" tabindex="' + (k === active ? '0' : '-1') + '" aria-selected="' + (k === active) + '" data-act="' + act + '" data-arg="' + k + '">' + esc(label) + (n != null ? '<span class="n">' + esc(n) + '</span>' : '') + '</button>').join('') + '</div>'
  },
  seg(items, active, act) {
    return '<div class="seg" role="tablist">' + items.map(([k, label]) =>
      '<button role="tab" aria-selected="' + (k === active) + '" data-act="' + act + '" data-arg="' + k + '">' + esc(label) + '</button>').join('') + '</div>'
  },
}

    + (actions ? '<div class="page-actions">' + actions + '</div>' : '') + '</header>'
}

function pageFooter() {
  return '<footer class="page-foot"><span>' + esc(META.dataNote || '数据来自本地真实快照；演示稿不产生任何 B 站操作') + '</span>'
    + (META.generatedAt ? '<span>快照 ' + esc(META.generatedAt) + '</span>' : '') + '<span>单文件演示稿 · 不联网</span></footer>'
}

function render(opts = {}) {
  clearInterval(liveTimer)
  renderShell()
  const view = document.getElementById('view')
  const keep = opts.keepScroll ? view.scrollTop : 0
  const body = (PAGES[S.page] || PAGES.overview)()
  view.innerHTML = '<div class="page">' + body + pageFooter() + '</div>'
  view.scrollTop = keep
  if (S.page === 'live' && S.liveDemo) startLiveClock()
}

function startLiveClock() {
  const el = document.querySelector('[data-live-clock]')
  const baseEl = document.querySelector('[data-live-base]')
  if (!el || !baseEl) return
  const base = Number(baseEl.getAttribute('data-live-base')) || 0
  const t0 = Date.now()
  const tick = () => { el.textContent = fmtDur(base + (Date.now() - t0)) }
  tick()
  liveTimer = setInterval(tick, 1000)
}

function go(page) { location.hash = '#/' + page }

function readRoute() {
  const h = String(location.hash || '').replace(/^#\/?/, '').split('?')[0]
  return PAGES[h] ? h : 'overview'
}

  dynamic: { label: '动态', icon: 'zap' }, 'reply-in': { label: '收到回复', icon: 'reply' }, 'reply-out': { label: '跟进回复', icon: 'reply' },
  'like-in': { label: '收到点赞', icon: 'thumb' }, skip: { label: '跳过', icon: 'x' }, note: { label: '备注', icon: 'info' },

const ACT_FILTERS = [['all', '全部'], ['view', '看过'], ['like', '点赞'], ['comment', '评论'], ['reply-in', '收到回复'], ['like-in', '收到点赞'], ['dynamic', '动态'], ['skip', '跳过']]

function activityItems() {
  const out = []
  ;(ACT.days || []).forEach((day) => (day.rounds || []).forEach((r) => (r.items || []).forEach((it) => out.push({ day: day.date, round: r, item: it }))))
  return out
}

function filterItem(it) {
  if (S.activityFilter !== 'all' && !(it.item.events || []).some((e) => e.type === S.activityFilter)) return false
  const q = S.activityQuery.trim().toLowerCase()
  if (!q) return true
  return (it.item.title || '').toLowerCase().includes(q) || (it.item.bvid || '').toLowerCase().includes(q) || (it.item.author || '').toLowerCase().includes(q)
}

function eventRow(e, opts = {}) {
  const m = EV_META[e.type] || { label: e.type, icon: 'dot' }
  let txt = e.text || e.reason || ''
  if (e.type === 'reply-in') txt = (e.user ? e.user + '：' : '') + (e.text || '')
  if (e.type === 'reply-out') txt = '我：' + (e.text || '')
  if (e.type === 'like-in') txt = '收到点赞' + (e.user ? ' · ' + e.user : '')
  if (e.type === 'skip') txt = '跳过：' + (e.reason || '')
  return '<div class="tl-item k-' + esc(e.type) + '">'
    + '<span class="who">' + esc(m.label) + '</span>'
    + '<span class="txt">' + esc(txt || '—') + '</span>'
    + '<span class="when">' + esc(hhmm(e.t) || '') + '</span></div>'
}

              + '<span class="spacer"></span>' + icon('chev', 'chev') + '</summary>'

              + '<div class="stages" style="margin-bottom:10px">' + [

              ].map(([label, done]) => '<div class="stage ' + (done ? 'done' : '') + '"><i></i><span>' + label + '</span></div>').join('') + '</div>'
              + (it.skipped ? '<div class="banner muted" style="margin-bottom:10px">' + icon('info') + '<span>跳过原因：' + esc(it.skipped.reason || '未记录') + '</span></div>' : '')
              + '<div class="tl">' + (it.events || []).map((e) => eventRow(e)).join('') + '</div>'
              + '<div class="row" style="margin-top:10px"><a class="link" href="https://www.bilibili.com/video/' + esc(it.bvid || '') + '" target="_blank" rel="noreferrer">在 B 站打开 ' + icon('external') + '</a></div>'
              + '</div></details>'
          }).join('')).join('')
    }).join('')
  } else {
    const rows = []
    shown.forEach((x) => (x.item.events || []).forEach((e) => rows.push({ e, it: x.item, day: x.day })))
    rows.sort((a, b) => String(b.e.t || '').localeCompare(String(a.e.t || '')))
    let lastDay = ''
    body = rows.map(({ e, it, day }) => {

      lastDay = day
      return sep + '<div class="row" style="align-items:flex-start;padding:8px 0;border-bottom:.5px solid var(--line)">'

  return head + filterBar + '<div style="margin-top:12px">' + stats + '</div>' + '<div style="margin-top:12px">' + body + '</div>'

/* ═══════════════════════════════════════════════════════════════════════════
   页面：日报（Markdown 渲染）
   ═══════════════════════════════════════════════════════════════════════════ */
const TICK = String.fromCharCode(96)
const FENCE = TICK + TICK + TICK
const INLINE_CODE = new RegExp(TICK + '([^' + TICK + ']+)' + TICK, 'g')

function mdToHtml(md) {
  const src = String(md || '').replace(/\r\n/g, '\n')
  const inline = (t) => esc(t)
    .replace(INLINE_CODE, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noreferrer">$2</a>')
  const out = []
  let para = [], list = false, code = [], inCode = false
  const flushPara = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = [] } }
  const flushList = () => { if (list) { out.push('</ul>'); list = false } }
  const flushCode = () => { if (inCode) { out.push('<pre><code>' + code.map(esc).join('\n') + '</code></pre>'); code = []; inCode = false } }
  for (const raw of src.split('\n')) {
    const line = raw.replace(/\s+$/, '')
    if (line.trim().startsWith(FENCE)) {
      flushPara(); flushList()
      if (inCode) flushCode(); else { inCode = true; code = [] }
      continue
    }
    if (inCode) { code.push(raw); continue }
    if (!line.trim()) { flushPara(); flushList(); continue }
    const h = /^(#{1,3})\s+(.*)$/.exec(line)
    if (h) { flushPara(); flushList(); out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); continue }
    if (/^-{3,}\s*$/.test(line)) { flushPara(); flushList(); out.push('<hr>'); continue }
    const q = /^>\s?(.*)$/.exec(line)
    if (q) { flushPara(); flushList(); out.push('<blockquote>' + inline(q[1]) + '</blockquote>'); continue }
    const li = /^[-*]\s+(.*)$/.exec(line)
    if (li) { flushPara(); if (!list) { out.push('<ul>'); list = true } out.push('<li>' + inline(li[1]) + '</li>'); continue }
    flushList(); para.push(line)
  }
  flushPara(); flushList(); flushCode()
  return out.join('')
}

function renderReports() {
  const days = Array.isArray(REPORTS.days) ? REPORTS.days : []
  const contents = REPORTS.contents || {}
  const digests = Array.isArray(REPORTS.digests) ? REPORTS.digests : []
  const overlay = REPORTS.overlay || null
  const first = days[0]?.date || (overlay ? 'overlay' : null)
  if (!S.reportDay || (!contents[S.reportDay] && S.reportDay !== 'overlay' && !digests.some((d) => d.name === S.reportDay))) S.reportDay = first
  const active = S.reportDay
  const isOverlay = active === 'overlay'
  const isDigest = digests.some((d) => d.name === active)
  const text = isOverlay ? (overlay.text || '') : isDigest ? (REPORTS.digestContents?.[active] || '') : (contents[active] || '')
  const activeMeta = isOverlay ? { name: 'headless-overlay.yml', bytes: (overlay.text || '').length }
    : isDigest ? digests.find((d) => d.name === active)
    : days.find((d) => d.date === active)
  const item = (key, name, meta, sel, ic) => '<button class="nav-item" style="width:100%;border:0;background:' + (sel ? 'var(--nav-active)' : 'transparent') + ';text-align:left" data-act="report-day" data-arg="' + esc(key) + '" aria-current="' + (sel ? 'true' : 'false') + '">'
    + icon(ic || 'doc') + '<span class="nav-text">' + esc(name) + '</span>' + (meta ? '<span class="nav-count">' + esc(meta) + '</span>' : '') + '</button>'

  const left = '<section class="card"><header class="card-h"><span class="card-t">报告</span><span class="card-m">' + (days.length + digests.length + (overlay ? 1 : 0)) + ' 个文件</span></header>'
    + '<div class="card-b" style="padding:8px">'
    + (days.length ? days.map((d) => item(d.date, d.date + '.md', fmtBytes(d.bytes), active === d.date, 'doc')).join('') : C.empty({ icon: 'doc', title: '还没有日报', text: '每轮值班会写一份 out/YYYY-MM-DD.md。' }))
    + (digests.length ? '<div class="note" style="padding:10px 10px 4px;border-top:.5px solid var(--line);margin-top:6px">月度归档</div>' + digests.map((d) => item(d.name, 'digest/' + d.name, fmtBytes(d.bytes), active === d.name, 'layers')).join('') : '')
    + (overlay ? item('overlay', 'headless-overlay.yml', '诊断', active === 'overlay', 'sliders') : '')
    + '</div></section>'

  const right = '<section class="card"><header class="card-h"><span class="card-t">' + esc(active ? (isOverlay ? 'headless-overlay.yml' : '日报 ' + (isDigest ? 'digest/' + active : active)) : '选择一份报告') + '</span>'
    + (activeMeta ? '<span class="card-m">' + esc(fmtBytes(activeMeta.bytes || (text.length * 2))) + ' · UTF-8</span>' : '')
    + '<span class="card-a">' + C.btn({ label: '复制文件名', icon: 'copy', cls: 'ghost sm', act: 'toast', arg: '演示稿：复制 ' + (active || '') }) + '</span></header>'
    + '<div class="card-b">' + (text ? '<article class="md">' + mdToHtml(text) + '</article>'
      : C.empty({ icon: 'doc', title: isDigest ? '快照未包含归档正文' : '这份报告没有正文', text: isDigest ? '演示稿只打包了日报正文；归档请在桌面端打开 digest/' + active + '。' : '列表里能看到文件，但内容为空。' }))
      + '</div></section>'

  return pageHeader('日报', PAGE_META.reports.sub, C.btn({ label: '刷新', icon: 'refresh', cls: 'sm', act: 'refresh' }))
    + '<div class="split">' + left + right + '</div>'
}

function renderSeen() {
  const allRows = Array.isArray(SEEN.rows) ? SEEN.rows : []
  const notes = allRows.filter((r) => !r.bvid).length
  const rows = allRows.filter((r) => r.bvid)
  const q = S.seenQuery.trim().toLowerCase()
  const shown = rows.filter((r) => !q || [r.bvid, r.title, r.action].some((x) => String(x || '').toLowerCase().includes(q)))
  const dates = rows.map((r) => r.date).filter(Boolean).sort()
  const actionChip = (a) => {
    const s = String(a || '')
    const out = []
    if (/跳过/.test(s)) out.push(C.chip('跳过', ''))
    else {
      if (/看过/.test(s)) out.push(C.chip('看过', ''))
      if (/赞/.test(s)) out.push(C.chip('赞', 'pink'))
      if (/评论/.test(s)) out.push(C.chip('评论', 'info'))
      if (/动态|分享/.test(s)) out.push(C.chip('动态', 'warn'))
      if (/回复/.test(s)) out.push(C.chip('回复', 'ok'))
      if (!out.length) out.push(C.chip(s || '—', ''))
    }
    return '<span title="' + esc(s) + '">' + out.join(' ') + '</span>'
  }
  const hasTime = rows.some((r) => r.time)
  const table = shown.length

const PF_TABS = [['card', '卡片'], ['preview', '编译预览'], ['quality', '质量 / L0'], ['bank', '语料库'], ['lore', '见闻库'], ['state', '今日状态'], ['version', '版本对比'], ['sandbox', '试写沙盒']]
const BLOCK_NAME = { core: 'P1 核心', lore: 'P2 见闻索引', state: 'P3 今日状态', samples: 'P4 语料样本', tail: 'P5 最后一公里' }

function pf() {
  const card = PD.card || {}
  const comp = PD.compiled || { stats: { per: [], total: 0, totalMax: 3000 }, blocks: {}, notes: [] }
  const stats = comp.stats || { per: [], total: 0, totalMax: 3000 }
  const per = Array.isArray(stats.per) ? stats.per : []
  const l0 = Array.isArray(PD.l0) ? PD.l0 : []
  const l0pass = l0.filter((c) => c.level === 'pass').length
  return { card, comp, stats, per, l0, l0pass, bank: PD.bank || { buckets: {}, total: 0 }, state: PD.state || {}, lore: Array.isArray(PD.lore) ? PD.lore : [], diff: Array.isArray(PD.diff) ? PD.diff : [], sandbox: Array.isArray(PD.sandbox) ? PD.sandbox : [], promptLen: PD.promptLen || 0, active: PD.active || {}, pickForm: PD.pickForm || 'question' }
}

function pfBars() {
  const { per, stats } = pf()
  return per.map((x) => '<div class="pf-budget"><span class="note">' + esc(BLOCK_NAME[x.name] || x.name) + '</span>'
    + '<div class="bar"><i class="' + (x.len > x.max ? 'err' : x.len > x.max * 0.9 ? 'warn' : '') + '" style="width:' + clampPct(x.len, x.max) + '%"></i></div>'
    + '<span class="pf-num">' + x.len + '/' + x.max + '</span></div>').join('')
    + '<div class="note" style="margin-top:8px">合计 ' + stats.total + ' / ' + stats.totalMax + ' 字符（' + clampPct(stats.total, stats.totalMax) + '%）</div>'
    + '<div class="note" style="margin-top:4px">分块里的「N 字原文」是卡片原文（含不注入的 creatorNotes），与上方注入字符不是同一口径。</div>'

  }).join('')

function cfgBaseline() {
  const d = { ...(CFG.defaults || {}) }
  for (const k of Object.keys(CFG.values || {})) d[k] = CFG.values[k]
  return d
}
function cfgModel() {
  if (!S.settings) {
    S.settings = cfgBaseline()
    S.settingsSaved = JSON.parse(JSON.stringify(S.settings))
  }
  return S.settings
}
function cfgDirtyKeys() {
  const v = cfgModel(), b = S.settingsSaved || cfgBaseline()
  return Object.keys(v).filter((k) => JSON.stringify(v[k]) !== JSON.stringify(b[k]))
}

function setCfg(k, val) {
  cfgModel()[k] = val
  render({ keepScroll: true })
}

function savebarHtml() {
  const n = cfgDirtyKeys().length
  return '<div class="savebar" id="savebar"' + (n ? '' : ' style="position:static"') + '>'
    + (n ? '<span class="dirty-dot"></span><span class="note">' + n + ' 处修改未保存</span>' : '<span class="pill ok"><i></i>已保存</span><span class="note">' + (S.settingsSavedAt ? '最近保存 ' + esc(S.settingsSavedAt) : '与持久化配置一致') + '</span>')
    + '<span class="spacer"></span>'
    + C.btn({ label: '恢复默认', cls: 'ghost sm', act: 'settings-reset' })
    + C.btn({ label: '保存并生效', icon: 'check', cls: 'primary sm', act: 'settings-save', attrs: n ? '' : 'disabled' })
    + '</div>'
}

const PAGES = {
  overview: renderOverview, live: renderLive, activity: renderActivity, reports: renderReports,
  seen: renderSeen, persona: renderPersona, settings: renderSettings,
}

let inputTimer = null
function refocus(key, value) {
  const el = document.querySelector('[data-input="' + key + '"]')
  if (el) { el.focus(); try { el.setSelectionRange(value.length, value.length) } catch { /* 不是文本输入 */ } }
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]')
  if (!a) return
  const act = a.getAttribute('data-act') || ''
  const arg = a.getAttribute('data-arg') || ''
  switch (act) {
    case 'theme':
      S.theme = S.theme === 'dark' ? 'light' : 'dark'
      store.set('bf-theme', S.theme)
      applyTheme()
      return
    case 'collapse':
      S.collapsed = !S.collapsed
      store.set('bf-collapsed', S.collapsed ? '1' : '0')
      renderShell()
      return
    case 'go': go(arg); return
    case 'refresh': render({ keepScroll: true }); toast('已刷新（演示稿：数据为本地快照）'); return
    case 'run': toast('演示稿：值班启动未接；真实实现会起一个 headless 子进程'); return
    case 'stop': toast('演示稿：中止未接'); return
    case 'toast': toast(arg || '演示稿'); return
    case 'live-mode': S.liveDemo = arg === 'running'; render({ keepScroll: true }); return
    case 'live-filter': S.liveFilter = arg; render({ keepScroll: true }); return
    case 'live-autoscroll': S.autoScroll = !S.autoScroll; render({ keepScroll: true }); return
    case 'activity-view': S.activityView = arg; render({ keepScroll: true }); return
    case 'activity-filter': S.activityFilter = arg; render({ keepScroll: true }); return
    case 'persona-tab': S.personaTab = arg; render({ keepScroll: true }); return
    case 'bank-bucket': S.bankForm = arg; render({ keepScroll: true }); return
    case 'bank-pick': S.pickSeed = Math.random() * 10; render({ keepScroll: true }); return
    case 'report-day': S.reportDay = arg; render({ keepScroll: true }); return
    case 'set-switch': setCfg(arg, !cfgModel()[arg]); return
    case 'set-num': setCfg(arg, Math.max(0, (Number(cfgModel()[arg]) || 0) + Number(a.getAttribute('data-delta') || 0))); return
    case 'tag-del': {
      const idx = arg.indexOf('|')
      const k = idx >= 0 ? arg.slice(0, idx) : arg
      const val = idx >= 0 ? arg.slice(idx + 1) : ''
      setCfg(k, (cfgModel()[k] || []).filter((x) => String(x) !== val))
      return
    }
    case 'settings-reset': S.settings = null; S.settingsSavedAt = ''; render({ keepScroll: true }); toast('已恢复为配置默认值'); return
    case 'settings-save': {
      S.settingsSaved = JSON.parse(JSON.stringify(cfgModel()))
      S.settingsSavedAt = hhmm(new Date())
      render({ keepScroll: true })
      toast('演示稿：保存未接；真实实现写入 profile 并热生效')
      return
    }
    default: return
  }
})

document.addEventListener('input', (e) => {
  const t = e.target
  const seenKey = t.getAttribute('data-input')
  if (seenKey === 'seen-query' || seenKey === 'activity-query') {
    if (seenKey === 'seen-query') S.seenQuery = t.value
    else S.activityQuery = t.value
    clearTimeout(inputTimer)
    inputTimer = setTimeout(() => { render({ keepScroll: true }); refocus(seenKey, t.value) }, 160)
    return
  }
  const cfgKey = t.getAttribute('data-cfg')
  if (cfgKey) {
    cfgModel()[cfgKey] = t.value
    const savebar = document.getElementById('savebar')
    if (savebar) savebar.outerHTML = savebarHtml()
    return
  }
})

document.addEventListener('keydown', (e) => {
  const t = e.target
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && t && t.getAttribute && t.getAttribute('role') === 'tab') {
    const tabs = [...t.parentElement.querySelectorAll('[role="tab"]')]
    const i = tabs.indexOf(t)
    const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length]
    if (next) { next.focus(); next.click(); e.preventDefault() }
    return
  }
  const addKey = t && t.getAttribute && t.getAttribute('data-add-tag')
  if (addKey && e.key === 'Enter') {
    const val = String(t.value || '').trim()
    if (!val) return
    const cur = cfgModel()[addKey] || []
    if (!cur.includes(val)) setCfg(addKey, cur.concat(val))
    t.value = ''
    e.preventDefault()
  }
  if (e.key === 'Escape') { const toastEl2 = document.getElementById('toast'); if (toastEl2) toastEl2.classList.remove('on') }
})

window.addEventListener('hashchange', () => {
  const next = readRoute()
  if (next !== S.page) { S.page = next; render() }
})

/* 启动：支持 ?theme=light|dark 覆盖（方便评审/截图），否则读 localStorage */
try {
  const qs = new URLSearchParams(location.search)
  const t = qs.get('theme')
  if (t === 'light' || t === 'dark') S.theme = t
} catch { /* file:// 下 URLSearchParams 一般可用 */ }
applyTheme()
S.page = readRoute()
if (window.innerWidth < 1180 && store.get('bf-collapsed', '0') === '0') S.collapsed = true
render()

</script>
</body>
