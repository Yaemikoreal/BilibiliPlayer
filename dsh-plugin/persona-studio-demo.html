<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B站分身 · 人设工作室（演示稿 v1）</title>
<style>
:root{
  --bg:#16161d; --sidebar:#1c1c24; --layer1:#20202a; --layer2:#262633;
  --border:#2e2e3a; --border2:#3a3a4a;
  --txt:#e8e8ee; --txt2:#9a9aa8; --txt3:#6b6b78;
  --brand:#4d6bfe; --brand2:#7a90ff;
  --ok:#34c37e; --warn:#f0a020; --err:#e5484d; --idle:#565664;
  --bili:#fb7299; --bili2:#00aeec;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
.app{display:flex;height:100vh;overflow:hidden}
.muted{color:var(--txt3)}
.mono{font-family:"Cascadia Code",Consolas,"SF Mono",monospace;font-variant-numeric:tabular-nums}

/* 左栏（示意） */
.side{width:196px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:16px 14px;font-weight:700;color:var(--txt2);letter-spacing:.5px;border-bottom:1px solid var(--border)}
.brand b{color:var(--brand2)}
.side nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.sitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--txt2);text-decoration:none;font-size:13.5px}
.sitem:hover{background:var(--layer1);color:var(--txt)}
.sitem.active{background:var(--layer2);color:var(--txt)}
.sitem .dot{display:none;width:6px;height:6px;border-radius:50%;background:var(--bili);margin-left:auto}
.sitem.active .dot{display:inline-block}
.side .foot{padding:8px;border-top:1px solid var(--border)}
.side .demo{margin:0 10px 8px;font-size:11px;color:var(--txt3);text-align:center;border:1px dashed var(--border2);border-radius:6px;padding:4px}

/* 主区 */
.main{flex:1;overflow-y:auto;padding:18px 22px 48px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:19px;display:flex;align-items:center;gap:8px}
h1 .tv{color:var(--bili2)}
.chip{background:var(--layer1);border:1px solid var(--border);border-radius:99px;padding:3px 12px;font-size:12.5px;color:var(--txt2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip b{color:var(--txt);font-weight:600}
.st{width:8px;height:8px;border-radius:50%;display:inline-block}
.st.ok{background:var(--ok)} .st.warn{background:var(--warn)} .st.err{background:var(--err)} .st.idle{background:var(--idle)}
.spacer{flex:1}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:var(--layer1);color:var(--txt);border:1px solid var(--border2)}
.btn.small{padding:5px 12px;font-size:12.5px;border-radius:7px}

/* 提示条 */
.note{border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.65;margin-bottom:12px;border:1px solid var(--border);background:var(--layer1);color:var(--txt2)}
.note b{color:var(--txt)}
.note.warn{border-color:#5a4416;background:#2a2214}
.note.info{border-color:#24395e;background:#17202f}
.note .tag{font-size:11px;border:1px solid var(--border2);border-radius:5px;padding:1px 6px;margin-right:6px;color:var(--txt3)}

/* Tabs */
.tabs{display:flex;gap:4px;margin:2px 0 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{padding:8px 15px;cursor:pointer;color:var(--txt2);border-bottom:2px solid transparent;font-size:13.5px;user-select:none}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--txt);border-bottom-color:var(--brand)}
.tab .n{font-size:11px;color:var(--txt3);margin-left:5px}
.pane{display:none} .pane.on{display:block}

/* 卡片 */
.card{background:var(--layer1);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card h3{font-size:13px;color:var(--txt2);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-size:11px;color:var(--txt3);font-weight:400}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1150px){.cols,.cols3{grid-template-columns:1fr}}

/* 区块编辑（只读演示） */
.sec{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;background:var(--layer1)}
.sec header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--layer2);cursor:pointer;font-size:13px}
.sec header .k{color:var(--txt2);font-size:11.5px;font-family:monospace}
.sec header .c{margin-left:auto;font-size:11px;color:var(--txt3)}
.sec .body{padding:10px 12px;font-size:12.8px;color:var(--txt2);white-space:pre-wrap;line-height:1.7;border-top:1px solid var(--border)}
.sec .body .ln{display:flex;gap:8px;margin:3px 0}
.sec .body .ln i{color:var(--bili);font-style:normal;flex-shrink:0}
.sec.closed .body{display:none}

/* 预算条 */
.qrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.qrow .lb{width:88px;color:var(--txt2);font-size:12.5px;flex-shrink:0}
.bar{flex:1;height:8px;background:var(--layer2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.over{background:var(--err)}
.qrow .val{width:86px;text-align:right;font-size:12px;color:var(--txt2);font-variant-numeric:tabular-nums;flex-shrink:0}

/* 编译预览 */
.pv{background:#131319;border:1px solid var(--border);border-radius:10px;padding:0;overflow:hidden}
.pv .hd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--layer2);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--txt2)}
.pv .hd .b{background:var(--layer1);border:1px solid var(--border2);border-radius:5px;padding:1px 7px;font-size:11px;color:var(--txt3)}
.pv pre{margin:0;padding:12px 14px;font-size:12.2px;line-height:1.75;color:#cfd2dc;white-space:pre-wrap;word-break:break-word;font-family:"Cascadia Code",Consolas,monospace;max-height:520px;overflow:auto}
.blk{border-left:3px solid var(--border2);padding-left:10px;margin:10px 0;display:block}
.blk .bh{font-size:11px;color:var(--txt3);margin-bottom:2px}
.blk.core{border-left-color:var(--brand)}
.blk.lore{border-left-color:var(--bili2)}
.blk.state{border-left-color:var(--bili)}
.blk.samples{border-left-color:var(--ok)}
.blk.tail{border-left-color:var(--warn)}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:12.6px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--txt3);font-weight:500;font-size:11.5px;text-transform:none}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}

/* L0 判据 */
.l0{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:900px){.l0{grid-template-columns:1fr}}
.l0c{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--layer1)}
.l0c .t{display:flex;align-items:center;gap:8px;font-size:12.8px}
.l0c .t .r{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--border2);color:var(--txt3)}
.l0c.pass{border-color:#234f3c} .l0c.pass .r{color:var(--ok);border-color:#2a5c46}
.l0c.warn{border-color:#4f421f} .l0c.warn .r{color:var(--warn);border-color:#5c4c24}
.l0c.fail{border-color:#5a2a2c} .l0c.fail .r{color:var(--err);border-color:#6a3235}
.l0c .d{font-size:11.8px;color:var(--txt3);margin-top:5px}

/* 语料库 */
.bk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:1150px){.bk{grid-template-columns:1fr 1fr}}
.bkc{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--layer1);cursor:pointer}
.bkc.on{border-color:var(--brand2);background:var(--layer2)}
.bkc .h{display:flex;align-items:center;gap:8px;font-size:13px}
.bkc .h .r{margin-left:auto;font-size:11.5px;color:var(--txt3)}
.bkc .bar{margin-top:8px}
.samples{list-style:none;margin-top:10px}
.samples li{padding:7px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--layer1);font-size:12.8px}
.samples li .m{font-size:11px;color:var(--txt3);margin-top:3px;font-family:monospace}
.pick{background:var(--layer2);border:1px dashed var(--brand2);border-radius:10px;padding:10px 12px;margin-top:10px}
.pick .l{font-size:12.5px;color:var(--txt2);margin-bottom:6px}
.pick pre{margin:0;font-size:12.4px;line-height:1.75;color:#cfd2dc;white-space:pre-wrap;font-family:"Cascadia Code",Consolas,monospace}

/* 状态 */
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:1000px){.kv{grid-template-columns:1fr 1fr}}
.kvc{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--layer1)}
.kvc .k{font-size:11.5px;color:var(--txt3)}
.kvc .v{font-size:16px;font-weight:600;margin-top:2px}
.kvc .s{font-size:11.5px;color:var(--txt3);margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tg{border:1px solid var(--border2);border-radius:99px;padding:2px 9px;font-size:11.5px;color:var(--txt2)}
.tg.owed{border-color:#5c4c24;color:var(--warn);background:#2a2214}
.tg.ok{border-color:#2a5c46;color:var(--ok);background:#14261d}

/* 版本 diff */
.diff{display:grid;grid-template-columns:1fr;gap:0}
.diff .r{display:grid;grid-template-columns:180px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.7px}
.diff .r .k{color:var(--txt3)}
.diff .r .v b{color:var(--txt)}
.diff .old{color:var(--err);font-family:monospace;font-size:12px}
.diff .new{color:var(--ok);font-family:monospace;font-size:12px}

/* 沙盒 */
.cand{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--layer1)}
.cand.fail{border-color:#5a2a2c}
.cand .tx{font-size:13px;color:var(--txt)}
.cand .mt{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.cand .mt span{font-size:11px;border:1px solid var(--border2);border-radius:5px;padding:1px 6px;color:var(--txt3);font-family:monospace}
.cand .rs{font-size:11.8px;color:var(--err);margin-top:6px}
.cand.pass .rs{color:var(--ok)}
input[type=text],textarea{background:var(--layer2);border:1px solid var(--border2);border-radius:8px;color:var(--txt);padding:8px 10px;font:inherit;font-size:13px;width:100%}
textarea{min-height:58px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row > label{font-size:12.5px;color:var(--txt3);width:72px;flex-shrink:0}
.foot{margin-top:18px;font-size:11.5px;color:var(--txt3);text-align:center}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">B站分身 <b>· 控制台</b></div>
    <nav>
      <a class="sitem" href="#">概览</a>
      <a class="sitem" href="#">实时运行</a>
      <a class="sitem" href="#">账本</a>
      <a class="sitem" href="#">报告</a>
      <a class="sitem active" href="#">人设工作室 <span class="dot"></span></a>
      <a class="sitem" href="#">设置</a>
    </nav>
    <div class="foot"><div class="demo">演示稿 · 数据来自真实人设卡</div></div>
  </aside>

  <main class="main">
    <div class="top">
      <h1>人设工作室 <span class="tv">Persona Studio</span></h1>
      <span class="chip" id="chip-active"></span>
      <span class="chip" id="chip-budget"></span>
      <span class="spacer"></span>
      <button class="btn ghost small" id="btn-sim">模拟一次编译</button>
      <button class="btn small">保存并生效</button>
    </div>

    <div class="note info">
      <span class="tag">演示</span>
      <b>这是改 UI 之前的设计稿。</b>卡片内容、编译产物、L0 判据、语料库、见闻库、状态、版本对比都来自<b>真实代码与真实人设卡</b>；
      沙盒里的候选句是真实历史评论 + 真实判定逻辑，但「生成」这一步没接模型（不花 token、不发 B 站）。
    </div>

    <div class="tabs" id="tabs"></div>
    <div id="panes"></div>

    <div class="foot" id="foot"></div>
  </main>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const TABS = [
  ['card', '卡片'],
  ['preview', '编译预览'],
  ['quality', '质量 / L0'],
  ['bank', '语料库'],
  ['lore', '见闻库'],
  ['state', '今日状态'],
  ['version', '版本对比'],
  ['sandbox', '试写沙盒'],
];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (n, m) => Math.min(100, Math.round((n / m) * 100));
const barCls = (n, m) => (n > m ? 'over' : n > m * 0.9 ? 'warn' : 'ok');

/* ── 顶部 chips ── */
document.getElementById('chip-active').innerHTML =
  `<span class="st ok"></span>生效：<b>${esc(DATA.active.presetId)}@${esc(DATA.card.version)}</b><span class="muted">（${esc(DATA.active.mode)}）</span>`;
document.getElementById('chip-budget').innerHTML =
  `人设 <b class="mono">${DATA.compiled.stats.total}</b><span class="muted">/${DATA.compiled.stats.totalMax}</span>　整轮 prompt <b class="mono">${DATA.promptLen}</b>`;

/* ── Tabs ── */
const tabsEl = document.getElementById('tabs');
tabsEl.innerHTML = TABS.map(([k, t], i) =>
  `<div class="tab${i === 0 ? ' on' : ''}" data-k="${k}">${t}${k === 'quality' ? `<span class="n">${DATA.l0.filter(c => c.level === 'pass').length}/6</span>` : ''}${k === 'bank' ? `<span class="n">${DATA.bank.total}</span>` : ''}</div>`).join('');

const panes = {
  card: renderCard,
  preview: renderPreview,
  quality: renderQuality,
  bank: renderBank,
  lore: renderLore,
  state: renderState,
  version: renderVersion,
  sandbox: renderSandbox,
};
const panesEl = document.getElementById('panes');
panesEl.innerHTML = TABS.map(([k]) => `<section class="pane${k === 'card' ? ' on' : ''}" id="pane-${k}">${panes[k]()}</section>`).join('');
tabsEl.addEventListener('click', (e) => {
  const t = e.target.closest('.tab'); if (!t) return;
  [...tabsEl.children].forEach(x => x.classList.toggle('on', x === t));
  [...panesEl.children].forEach(p => p.classList.toggle('on', p.id === `pane-${t.dataset.k}`));
});

/* ── 折叠区块 ── */
document.addEventListener('click', (e) => {
  const hd = e.target.closest('.sec > header');
  if (hd) hd.parentElement.classList.toggle('closed');
  const bkc = e.target.closest('.bkc');
  if (bkc) { document.querySelectorAll('.bkc').forEach(x => x.classList.toggle('on', x === bkc)); renderBucketSamples(bkc.dataset.form); }
  const pickBtn = e.target.closest('#btn-pick');
  if (pickBtn) { pickBtn.blur(); renderPick(); }
});

/* ───────────── 卡片 ───────────── */
function renderCard() {
  const c = DATA.card;
  const secs = [
    ['identity', '身份', [
      c.identity.oneLiner, '边界：' + (c.identity.boundaries || []).join(' / '), c.identity.selfAwareness, c.identity.background,
    ]],
    ['voice', '口吻（语体事实）', [
      '语感：' + (c.voice.register || []).join('、'),
      '句长：多数 ' + c.voice.sentence.typical.join('–') + ' 字，硬上限 ' + c.voice.sentence.hardMax,
      '标点：' + JSON.stringify(c.voice.punctuation),
      '表情：' + JSON.stringify(c.voice.emoji),
      '手段表（' + c.voice.moves.length + ' 类）：' + c.voice.moves.join(' / '),
      '情绪档：轻「' + c.voice.intensity['轻'] + '」/ 中「' + c.voice.intensity['中'] + '」/ 重「' + c.voice.intensity['重'] + '」',
    ]],
    ['mindset', '心态（矛盾 / 破防）', [
      ...c.mindset.traits.map(t => `${t.name}（${t.level}）：${(t.behaviors || []).join('；')}`),
      '矛盾：' + c.mindset.contradictions.join('；'),
      '破防：' + c.mindset.emotion.breakingPoint,
    ]],
    ['taste', '品味（看什么 / 绕开）', [
      '会看：' + c.taste.watch.join('、'), '绕开：' + c.taste.avoid.join('、'), '标准：' + (c.taste.criteria || []).join('；'),
    ]],
    ['stance', '立场（含"别误读"）', c.stance.map(s => `${s.topic}：${s.attitude}｜${s.how}｜别读成：${s.misread || '—'}`)],
    ['redlines', '红线（三件套）', c.redlines.map(r =>
      `【${r.severity}】${r.rule}\n     为什么：${r.why}\n     那要写成：${r.instead}${r.regex ? `\n     机检：/${r.regex}/` : ''}`)],
    ['canon', '被问到（固定答法 + 冷却）', c.canon.map(x => `${x.when} →「${x.say}」（${x.cooldown}）`)],
    ['loreIndex', '见闻索引（正文按需读）', c.loreIndex.map(l => `${l.id} · ${l.keys.join('/')} · ${l.oneLine}`)],
    ['samples', '示例库（真实语料）', [
      ...c.voice.samples.good.map(s => `✔ [${s.form}] ${s.text}　← ${s.source}`),
      ...c.voice.samples.bad.map(s => `✘ ${s.text}　← ${s.reason}`),
    ]],
    ['creatorNotes', 'creatorNotes（不注入 prompt）', [String(c.creatorNotes).slice(0, 400) + '…']],
  ];
  const blk = DATA.compiled.stats.per;
  const bmap = Object.fromEntries(blk.map(b => [b.name, b]));
  return `
  <div class="cols">
    <div>
      <div class="card" style="margin-bottom:12px">
        <h3>人设卡 <span class="r">${esc(c.id)}@${esc(c.version)} · ${esc(c.license || '')}</span></h3>
        <div class="muted" style="font-size:12.5px;margin-bottom:10px">${esc(c.name)}　·　${esc(c.identity.oneLiner)}</div>
        <div class="qrow"><span class="lb">P1 核心</span><div class="bar"><i class="${barCls(bmap.core.len, bmap.core.max)}" style="width:${pct(bmap.core.len, bmap.core.max)}%"></i></div><span class="val">${bmap.core.len}/${bmap.core.max}</span></div>
        <div class="qrow"><span class="lb">P2 见闻索引</span><div class="bar"><i class="${barCls(bmap.lore.len, bmap.lore.max)}" style="width:${pct(bmap.lore.len, bmap.lore.max)}%"></i></div><span class="val">${bmap.lore.len}/${bmap.lore.max}</span></div>
        <div class="qrow"><span class="lb">P3 今日状态</span><div class="bar"><i class="${barCls(bmap.state.len, bmap.state.max)}" style="width:${pct(bmap.state.len, bmap.state.max)}%"></i></div><span class="val">${bmap.state.len}/${bmap.state.max}</span></div>
        <div class="qrow"><span class="lb">P4 语料样本</span><div class="bar"><i class="${barCls(bmap.samples.len, bmap.samples.max)}" style="width:${pct(bmap.samples.len, bmap.samples.max)}%"></i></div><span class="val">${bmap.samples.len}/${bmap.samples.max}</span></div>
        <div class="qrow"><span class="lb">P5 最后一公里</span><div class="bar"><i class="${barCls(bmap.tail.len, bmap.tail.max)}" style="width:${pct(bmap.tail.len, bmap.tail.max)}%"></i></div><span class="val">${bmap.tail.len}/${bmap.tail.max}</span></div>
        <div class="muted" style="font-size:11.5px;margin-top:8px">合计 ${DATA.compiled.stats.total} / ${DATA.compiled.stats.totalMax} 字符（${pct(DATA.compiled.stats.total, DATA.compiled.stats.totalMax)}%）</div>
      </div>
      ${secs.map(([k, t, lines]) => `
        <div class="sec closed">
          <header><span>${t}</span><span class="k">${k}</span><span class="c">${(lines.join('').length)} 字</span></header>
          <div class="body">${lines.map(l => `<div class="ln"><i>·</i><span>${esc(l)}</span></div>`).join('')}</div>
        </div>`).join('')}
    </div>
    <div>
      <div class="card">
        <h3>这份卡为什么长这样 <span class="r">设计依据</span></h3>
        <table>
          <tr><th>设计</th><th>解决什么</th></tr>
          <tr><td>creatorNotes 不注入</td><td>v1 里约 1/4 是写给维护者的解释（配比理由 / 日志复盘 / 语料统计），全部搬出 prompt</td></tr>
          <tr><td>红线必带 instead</td><td>只写"不许"会让注意力被那个画面捕获；每条都要给正向替代</td></tr>
          <tr><td>矛盾写成 X vs Y</td><td>"傲娇""毒舌"这类标签会直接激活模型的刻板模板</td></tr>
          <tr><td>手段表而非"标准句"</td><td>给 5 个固定收尾 → 六句里五句收在同一格（实测）</td></tr>
          <tr><td>口癖改低频配额</td><td>逐字清单会被"看到就用"，必然复读到腻</td></tr>
          <tr><td>示例带 source</td><td>示例的具体措辞会被逐字模仿，来源必须可查</td></tr>
        </table>
      </div>
      <div class="card">
        <h3>L0 六条 <span class="r">${DATA.l0.filter(c => c.level === 'pass').length}/6 通过</span></h3>

 return `

function renderBucketSamples(form) {
  const list = DATA.bank.buckets[form]?.entries || [];

  document.getElementById('bk-samples').innerHTML = list.map(e =>
    `<li>${esc(e.text)}<div class="m">${esc(e.source)} · len ${e.len} · ${e.status}</div></li>`).join('') || '<li class="muted">（空）</li>';

  const list = (DATA.bank.buckets[DATA.pickForm]?.entries || []).slice(0, 4);
