<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bilibili MCP — hero</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0b0e14; }
  .stage {
    position: relative;
    width: 1280px;
    height: 320px;
    overflow: hidden;
    background:
      radial-gradient(820px 500px at 80% 26%, rgba(251,114,153,0.15), transparent 64%),
      radial-gradient(680px 460px at 98% 80%, rgba(35,173,229,0.17), transparent 68%),
      radial-gradient(520px 360px at 4% 88%, rgba(35,173,229,0.10), transparent 70%),
      linear-gradient(126deg, #0a0d13 0%, #0c1017 46%, #0b0e16 100%);
    font-family: "Helvetica Neue", "Hiragino Sans GB", "PingFang SC", "Heiti SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  /* faint dot matrix */
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.075) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(900px 520px at 55% 45%, #000 10%, rgba(0,0,0,0.35) 62%, transparent 88%);
    mask-image: radial-gradient(900px 520px at 55% 45%, #000 10%, rgba(0,0,0,0.35) 62%, transparent 88%);
    opacity: 0.55;
  }
  /* top light sweep */
  .sheen {
    position: absolute; left: -10%; top: -70%;
    width: 120%; height: 150%;
    background: linear-gradient(104deg, transparent 38%, rgba(255,255,255,0.055) 50%, transparent 62%);
    pointer-events: none;
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(120% 150% at 50% 46%, transparent 42%, rgba(4,6,10,0.55) 100%);
    pointer-events: none;
  }
  .hairline {
    position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: linear-gradient(90deg, transparent 2%, rgba(251,114,153,0.55) 26%, rgba(126,143,205,0.5) 50%, rgba(35,173,229,0.55) 74%, transparent 98%);
    opacity: 0.6;
  }
  .content {
    position: absolute; inset: 0;
    display: flex; align-items: center;
    padding: 0 56px;
    gap: 18px;
  }
  .left { flex: 1 1 auto; min-width: 0; padding-top: 2px; }

  /* eyebrow */
  .eyebrow {
    display: inline-flex; align-items: center; gap: 9px;
    height: 26px;
    padding: 0 12px 0 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.10);
    color: #9aa5b8;
    font-size: 12.5px;
    letter-spacing: 0.11em;
    white-space: nowrap;
  }
  .eyebrow b { color: #e8edf5; font-weight: 600; letter-spacing: 0.06em; }
  .eyebrow .sep { color: #4d5566; letter-spacing: 0; }
  .pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: #3ddc97;
    box-shadow: 0 0 0 3px rgba(61,220,151,0.16), 0 0 10px rgba(61,220,151,0.65);
    flex: 0 0 auto;
  }

  /* title lockup */
  .lockup {
    display: flex; align-items: center; gap: 16px;
    margin-top: 13px;
    white-space: nowrap;
  }
  h1 {
    font-size: 62px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.028em;
    background: linear-gradient(178deg, #ffffff 18%, #cfd9ea 92%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 18px rgba(0,0,0,0.45));
  }
  .plugin {
    display: inline-flex; align-items: baseline; gap: 7px;
    padding: 7px 13px 8px;
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(251,114,153,0.17), rgba(251,114,153,0.08));
    border: 1px solid rgba(251,114,153,0.42);
    box-shadow: 0 6px 22px rgba(251,114,153,0.14);
    transform: translateY(-3px);
  }
  .plugin .tag { font-size: 10.5px; letter-spacing: 0.13em; color: #ff9fbb; opacity: 0.85; }
  .plugin .name { font-size: 21px; font-weight: 600; color: #ffd0dd; letter-spacing: 0.01em; }

  /* tagline */
  .tagline {
    margin-top: 15px;
    font-size: 25px;
    line-height: 1.2;
    letter-spacing: -0.005em;
    color: #aab5c8;
    white-space: nowrap;
  }
  .tagline .hi {
    background: linear-gradient(94deg, #ff8fb0 0%, #ffb3c7 42%, #6fd0f2 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 600;
  }

  /* chinese line */
  .zh {
    margin-top: 13px;
    font-size: 15.5px;
    line-height: 1.5;
    color: #7f8b9f;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .zh em { font-style: normal; color: #c3cddd; }
  .zh .bul { color: #fb7299; opacity: 0.85; margin: 0 5px; }

  /* chips */
  .chips { display: flex; align-items: center; gap: 8px; margin-top: 17px; white-space: nowrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 11px;
    border-radius: 8px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.09);
    color: #a8b3c6;
    font-size: 12px;
    letter-spacing: 0.03em;
  }
  .chip .ico { width: 6px; height: 6px; border-radius: 2px; }
  .chip.accent {
    background: linear-gradient(180deg, rgba(35,173,229,0.18), rgba(35,173,229,0.08));
    border-color: rgba(35,173,229,0.42);
    color: #a9e4fb;
  }
  .chip.pink {
    background: linear-gradient(180deg, rgba(251,114,153,0.16), rgba(251,114,153,0.07));
    border-color: rgba(251,114,153,0.38);
    color: #ffc2d3;
  }

  /* mascot */
  .mascot-wrap {
    flex: 0 0 auto;
    position: relative;
    width: 400px; height: 300px;
    display: flex; align-items: center; justify-content: center;
    margin-right: 6px;
  }
  .mascot-glow {
    position: absolute;
    width: 330px; height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle at 46% 44%, rgba(251,114,153,0.18), rgba(35,173,229,0.09) 52%, transparent 72%);
    filter: blur(6px);
  }
  .mascot-wrap img { position: relative; width: 352px; height: auto; display: block; }
</style>
</head>
<body>
<div class="stage">
  <div class="dots"></div>
  <div class="sheen"></div>
  <div class="vignette"></div>

  <div class="content">
    <div class="left">
      <div class="eyebrow"><span class="pulse"></span><b>bilibili-mcp</b><span class="sep">·</span>本地运行的 B站 MCP Server</div>

      <div class="lockup">
        <h1>Bilibili MCP</h1>
        <span class="plugin"><span class="tag">DSH 插件</span><span class="name">B站分身</span></span>
      </div>

      <div class="tagline">Let your AI agent <span class="hi">actually</span> use Bilibili.</div>

      <div class="zh">
        登录<span class="bul">·</span>采集<span class="bul">·</span>发布<span class="bul">·</span>分析<span class="bul">·</span>互动<em>，一个本地 Server 打通B站全流程</em>
      </div>

      <div class="chips">
        <span class="chip pink"><span class="ico" style="background:#fb7299"></span>28 MCP tools</span>
        <span class="chip">Claude Code</span>
        <span class="chip">Cursor</span>
        <span class="chip accent"><span class="ico" style="background:#23ade5"></span>DeepSeek Harness</span>
        <span class="chip">MIT</span>
      </div>
    </div>

    <div class="mascot-wrap">
      <div class="mascot-glow"></div>
      <img src="mascot.svg" alt="mascot">
    </div>
  </div>

  <div class="hairline"></div>
</div>
</body>
</html>
