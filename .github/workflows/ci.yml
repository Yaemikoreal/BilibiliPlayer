name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 语法检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile entrypoints
        run: python -m py_compile mcp_server.py bili_login.py

      - name: Parse every tracked Python file
        run: |
          python - <<'PY'
          import ast
          import pathlib
          files = sorted(pathlib.Path(".").rglob("*.py"))
          files = [f for f in files if ".venv" not in f.parts and "__pycache__" not in f.parts]
          for f in files:
              ast.parse(f.read_text(encoding="utf-8"), filename=str(f))
          print(f"parsed {len(files)} python files")
          PY

  plugin:
    name: dsh-plugin 单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run node --test
        run: npm test
